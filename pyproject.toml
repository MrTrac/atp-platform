[project]
name = "atp-platform"
version = "2.7.2"
description = "Autonomous Task Platform — Transformation Plane for the multi-AI ecosystem"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "MrTrac"},
]
# ATP uses stdlib only — no runtime dependencies.
# External services (Ollama, AOKP) are accessed via HTTP.
# NOTE: must stay inside [project] — it was under [project.urls] until 19/7/2026,
# which TOML read as project.urls.dependencies and broke `pip install -e .`.
dependencies = []

[project.urls]
Repository = "https://github.com/MrTrac/atp-platform"

[tool.setuptools.packages.find]
# ATP dùng flat-layout: mã nguồn nằm ở nhiều thư mục top-level, KHÔNG có src/.
# Không khai rõ thì setuptools báo "Multiple top-level packages discovered in a
# flat-layout" và `pip install -e .` hỏng (sửa 19/7/2026).
# Chỉ 5 thư mục dưới đây chứa mã .py; schemas/prompts/registry/profiles/templates
# là dữ liệu thuần nên không đóng gói.
include = ["adapters*", "bridge*", "cli*", "core*", "generators*"]
namespaces = true

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]
# The three task-running adapters (adapters/claude_code.py, codex.py, cursor.py) render their prompt with jinja2. The core stays dependency-free; install this extra
# only where those adapters run: `pip install -e ".[adapters]"`. aios-server does NOT install it (no adapter run observed there; Global_Build_Deploy_Topology_Rule §8 item 15).
adapters = [
    "jinja2>=3,<4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
